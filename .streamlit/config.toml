# Thème institutionnel Crédit Agricole du Maroc
# Copier ce fichier dans .streamlit/config.toml puis redémarrer Streamlit.

[theme]
base = "light"
primaryColor = "#08734E"
backgroundColor = "#F7FAF8"
secondaryBackgroundColor = "#EDF4F0"
textColor = "#17372C"
linkColor = "#08734E"
borderColor = "#D8E4DE"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["34px", "26px", "20px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#073B2C"
secondaryBackgroundColor = "#0A4B38"
textColor = "#F4FBF7"
primaryColor = "#FFFFFF"
borderColor = "#1D604B"

[browser]
gatherUsageStats = false
